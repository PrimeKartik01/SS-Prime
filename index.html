<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custome CSS -->
    <link rel="stylesheet" href="index.css">
    <title>SS-Prime</title>
</head>

<body>
    <div class="blue-30">

        <!-- Navbar -->
        <nav class="flex justify-between items-center font-medium text-lg relative md:px-5">

            <!-- Logo -->
            <img src="images/logo.webp" alt="logo" class="logo w-30 h-20 object-cover">

            <!-- Desktop Menu -->
            <ul class="hidden md:flex gap-10">
                <li>Home</li>
                <li>Properties</li>
                <li>About</li>
            </ul>

            <!-- Desktop Button -->
            <div class="hidden md:block rounded-full px-7 py-1 bg-black text-white">
                Contact Now
            </div>

            <!-- Mobile Menu Button -->
            <button id="menu-btn" class="md:hidden text-3xl pr-4">
                ☰
            </button>

            <!-- Mobile Sidebar -->
            <div id="mobile-menu"
                class="fixed top-0 left-[-100%] w-60 h-screen bg-white shadow-2xl z-50 p-5 transition-all duration-1500">

                <!-- Close Button -->
                <button id="close-btn" class="text-4xl absolute top-5 right-5">
                    ×
                </button>

                <ul class="flex flex-col gap-8 mt-10 text-xl">
                    <li>Home</li>
                    <li>Properties</li>
                    <li>About</li>

                    <button class="rounded-full px-7 py-2 bg-black text-white">
                        Contact Now
                    </button>
                </ul>

            </div>

        </nav>

        <!-- Carousel -->
        <div class="w- h-[30rem]  overflow-hidden relative carousel-container">
            <div id="slider" class="flex h-full"></div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
